name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    env:
      OS_MIN_VERSION: 1.1.31
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Version Env
        id: prep
        run: |
          # 1. 移除开头的 v
          RAW_VER=${{ github.ref_name }}
          
          # 2. 统计点 (.) 的个数
          DOT_COUNT=$(echo "$RAW_VER" | tr -cd '.' | wc -c)
          
          # 3. 计算 VERSION_TAG: 如果是 4 段(eg: v1.9.3.1)，则将最后一个点换成 - (v1.9.3-1)
          if [ "$DOT_COUNT" -eq 3 ]; then
            VERSION_TAG="${RAW_VER%.*}-${RAW_VER##*.}"
          else
            VERSION_TAG="$RAW_VER"
          fi
          
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "🚀 Computed Version: $VERSION_TAG"

      - name: Pack
        run: |
          # 直接使用上一步存入 env 的 VERSION_TAG
          echo "Using Version: $VERSION_TAG"

          # 下载打包工具
          curl -L -o /usr/local/bin/fnpack https://github.com/DPanel-dev/actions/releases/download/build-toolchain/amd64-linux-fnpack
          chmod +x /usr/local/bin/fnpack
          {
            echo '### fnpack 版本'
            echo '```text'
            fnpack 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # --- 1. 处理 amd64 ---
          echo "📦 Processing amd64..."
          curl -L -o dpanel-amd64 https://github.com/donknap/dpanel/releases/download/${{ github.ref_name }}/dpanel-ce-gnu-amd64 
          mkdir -p app/server
          cp dpanel-amd64 app/server/dpanel

          sed -i "s/#version/${VERSION_TAG#v}/g" manifest
          sed -i "s/#os_min_version/${OS_MIN_VERSION}/g" manifest
          sed -i "s/#platform/x86/g" manifest

          fnpack build --nosign
          mv dpanel.fpk dpanel-amd64.fpk

          # --- 2. 处理 arm64 ---
          echo "📦 Processing arm64..."
          git checkout manifest # 恢复 manifest 模版
          
          curl -L -o dpanel-arm64 https://github.com/donknap/dpanel/releases/download/${{ github.ref_name }}/dpanel-ce-gnu-arm64 
          mkdir -p app/server
          cp dpanel-arm64 app/server/dpanel

          sed -i "s/#version/${VERSION_TAG#v}/g" manifest
          sed -i "s/#os_min_version/${OS_MIN_VERSION}/g" manifest
          sed -i "s/#platform/arm/g" manifest

          fnpack build --nosign
          mv dpanel.fpk dpanel-arm64.fpk

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dpanel-amd64.fpk
            dpanel-arm64.fpk
          prerelease: false

      - name: Release and Sync to FnDepot
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # --- 1. 上传文件到当前仓库 Release ---
          echo "📤 上传文件到 donknap/dpanel Release..."
          gh release upload "$TAG_NAME" dpanel-amd64.fpk dpanel-arm64.fpk --repo donknap/dpanel --clobber

          # 以实际发布的 FPK 为准，读取每个架构的下载地址、字节数和 SHA-256。
          RELEASE_JSON="$RUNNER_TEMP/dpanel-release.json"
          gh api "repos/donknap/dpanel/releases/tags/$TAG_NAME" > "$RELEASE_JSON"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REPO_DIR="./fndepot_repo"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/DPanel-dev/FnDepot.git" "$REPO_DIR"
          JSON_FILE="$REPO_DIR/fnpack.json"

          jq -e --slurpfile release "$RELEASE_JSON" \
            --arg version "${VERSION_TAG#v}" --arg os_min "$OS_MIN_VERSION" '
            def asset($name):
              first($release[0].assets[] | select(.name == $name)) // error("Missing asset: " + $name)
              | if .state == "uploaded" and .size > 0 and (.digest // "" | test("^sha256:[0-9a-f]{64}$"))
                then . else error("Incomplete asset: " + $name) end;
            def package: {download_url: .browser_download_url, size, sha256: (.digest | ltrimstr("sha256:"))};
            if .schema_version != "2" or (.apps.dpanel.releases | type) != "object"
            then error("Expected a FnDepot v2 index with DPanel releases") else . end
            | asset("dpanel-amd64.fpk") as $x86
            | asset("dpanel-arm64.fpk") as $arm
            | .apps.dpanel.releases[$version] = {
                changelog: ($release[0].body // ""),
                updated_at: ([$x86.updated_at, $arm.updated_at] | max),
                os_min_version: $os_min,
                packages: {x86: ($x86 | package), arm: ($arm | package)}
              }' "$JSON_FILE" > "$JSON_FILE.tmp"
          mv "$JSON_FILE.tmp" "$JSON_FILE"

          # 提交推送
          cd "$REPO_DIR"
          git add fnpack.json
          if git diff --staged --quiet; then
            echo "ℹ️ 内容无变化"
          else
            git commit -m "chore: update dpanel binary to $TAG_NAME"
            git push origin main
            echo "✅ 成功推送到 FnDepot"
          fi

  # ==============================
  # 上传 fpk 产物到 COS
  # ==============================
  upload-cos:
    # 临时停用 COS 上传；恢复时删除下面的 if。
    if: ${{ false }}
    needs: [build-and-sync]
    runs-on: ubuntu-latest
    steps:
      - name: Download fpk from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download ${{ github.ref_name }} -D bin --repo ${{ github.repository }} --pattern '*.fpk'

      - name: Install coscli
        run: |
          wget -q https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -O coscli
          chmod +x coscli

      - name: Configure coscli
        env:
          COS_SECRET_ID: ${{ secrets.CDN_QCLOUD_COSV5_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.CDN_QCLOUD_COSV5_SECRET_KEY }}
        run: |
          cat > ~/.cos.yaml <<EOF
          cos:
            base:
              secretid: ${COS_SECRET_ID}
              secretkey: ${COS_SECRET_KEY}
          EOF

      - name: Upload fpk to COS
        run: |
          ls -lh bin
          ./coscli cp -e cos.ap-shanghai.myqcloud.com bin/ cos://we7cloud-10016060/dpanel/release/ -r --part-size 10 --routines 20
          echo "✅ fpk files uploaded to COS"
